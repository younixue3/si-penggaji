{% extends 'layout/dashboard/base.html' %}
{% block title %}SI-Penggaji - Tambah Penugasan Template{% endblock %}
{% block content %}
<div class="container mx-auto px-6 py-8">
  <div class="bg-white rounded-xl shadow-md p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Tambah Penugasan Template</h2>

    <form method="POST" class="space-y-6" novalidate autocomplete="off">
      {% csrf_token %}

      <div class="grid grid-cols-1 gap-6">
        <div class="form-group">
          <label for="template" class="block text-sm font-medium text-gray-700 mb-2">
            Template Perhitungan <span class="text-red-500">*</span>
          </label>
          <select id="template" 
                  name="template" 
                  required 
                  aria-required="true"
                  class="w-full px-3 py-2 rounded-lg border-2 border-gray-300 focus:border-pink-500 focus:ring focus:ring-pink-200 transition duration-200">
            <option value="" disabled selected>Pilih Template</option>
            {% for template in templates %}
              <option value="{{ template.id }}">
                {{ template.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="user" class="block text-sm font-medium text-gray-700 mb-2">
            Pengguna <span class="text-red-500">*</span>
          </label>
          <select id="user" 
                  name="user" 
                  required 
                  aria-required="true"
                  class="w-full px-3 py-2 rounded-lg border-2 border-gray-300 focus:border-pink-500 focus:ring focus:ring-pink-200 transition duration-200">
            <option value="" disabled selected>Pilih Pengguna</option>
            {% for user in users %}
              <option value="{{ user.id }}">
                {{ user.username }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="flex justify-end space-x-4">
        <a href="{% url 'penggajiV2:assignment_list' %}" 
           class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500">
          Batal
        </a>
        <button type="submit" 
                class="px-4 py-2 bg-pink-500 text-white rounded hover:bg-pink-600 focus:outline-none focus:ring-2 focus:ring-pink-500">
          Simpan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
